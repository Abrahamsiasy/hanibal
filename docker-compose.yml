services:
  app:
    build:
      context: .
      target: app
    image: bet-app:app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bet

  nginx:
    build:
      context: .
      target: nginx
    image: bet-app:nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage_public:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - bet

  queue:
    image: bet-app:app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - bet

  scheduler:
    image: bet-app:app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
      CACHE_CONFIG: "false"
    command: php artisan schedule:work
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - bet

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bet_app}
      MYSQL_USER: ${DB_USERNAME:-bet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Optional: expose for debugging. Remove in hardened production.
      - "${DB_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - bet

volumes:
  mysql_data:
  storage_public:
  storage_logs:

networks:
  bet:
    driver: bridge
